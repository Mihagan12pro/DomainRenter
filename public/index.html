<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация домена</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./styles/style.css" />
</head>

<body>
  <form action="https://localhost:7135/api/domains/" method="POST" >
    <label>
      <span>Введите доменное имя</span>
      <input type="text" pattern="[a-zA-Z0-9]+[a-zA-Z0-9.\-]*\.[a-zA-Z]{2,}" title="Некорректный домен!"
        placeholder="site.ru" required />
    </label>
    <label>
      <span>Введите дату окончания аренды:</span>
      <input type="text" pattern="(0[1-9]|[12][0-9]|3[01])\.(0[1-9]|1[0-2])\.(19|20)[0-9]{2}"
        title="Введите дату в формате ДД.ММ.ГГГГ" placeholder="ДД.ММ.ГГГГ" required />
    </label>

    <label>
      Фамилия
      <input type="text" pattern="[А-ЯЁ][а-яё]+(-[А-ЯЁ][а-яё]+)?"
        title="Введите фамилию с большой буквы, возможно через дефис" placeholder="Иванов" required />
    </label>

    <label>
      Имя
      <input type="text" pattern="[А-ЯЁ][а-яё]+(-[А-ЯЁ][а-яё]+)?" title="Введите имя с большой буквы" placeholder="Иван"
        required />
    </label>

    <label>
      Отчество
      <input type="text" pattern="[А-ЯЁ][а-яё]+(-[А-ЯЁ][а-яё]+)?" title="Введите отчество с большой буквы"
        placeholder="Иванович" />
    </label>

    <label>
      <span>Введите почту</span>
      <input type="email" placeholder="example@ya.ru" required />
    </label>
    <label>
      <span>Введите номер телефона:</span>
      <input type="tel" pattern="\+\d{8,15}" title="Номер должен начинаться с + и содержать о 8 до 15 цифр"
        placeholder="+74952323232" required />
    </label>
    <button id="submitBtn" class="submit" type="submit">Отправить форму</button>
    <button id="resetBtn" class="reset" type="reset">Очистить форму</button>
  </form>
  
  <script>
    const submitButton = document.getElementById('submitBtn');
    const resetButton = document.getElementById('resetBtn');
    const form = document.querySelector('form');

    function checkFormValidity() {
      const inputs = form.querySelectorAll('input');
      let isValid = true;

      inputs.forEach(input => {
        if (!input.checkValidity()) {
          isValid = false;
        }
      });

      submitButton.disabled = !isValid;
      resetButton.disabled = false;
    }

    form.addEventListener('input', checkFormValidity);
    document.addEventListener('DOMContentLoaded', checkFormValidity);
  </script>

</body>

</html>
