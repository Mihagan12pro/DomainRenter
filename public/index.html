<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация домена</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./styles/style.css" />
</head>

<body>
  <form id="domainForm">
    <label>
      <span>Введите доменное имя</span>
      <input type="text" name="domain" pattern="[a-zA-Z0-9]+[a-zA-Z0-9.\-]*\.[a-zA-Z]{2,}" title="Некорректный домен!"
        placeholder="site.ru" required />
    </label>
    <label>
      <span>Введите дату окончания аренды:</span>
      <input type="text" name="rentEndDate" pattern="(0[1-9]|[12][0-9]|3[01])\.(0[1-9]|1[0-2])\.(19|20)[0-9]{2}"
        title="Введите дату в формате ДД.ММ.ГГГГ" placeholder="ДД.ММ.ГГГГ" required />
    </label>

    <label>
      Фамилия
      <input type="text" name="lastName" pattern="[А-ЯЁ][а-яё]+(-[А-ЯЁ][а-яё]+)?"
        title="Введите фамилию с большой буквы, возможно через дефис" placeholder="Иванов" required />
    </label>

    <label>
      Имя
      <input type="text" name="firstName" pattern="[А-ЯЁ][а-яё]+(-[А-ЯЁ][а-яё]+)?" title="Введите имя с большой буквы"
        placeholder="Иван" required />
    </label>

    <label>
      Отчество
      <input type="text" name="middleName" pattern="[А-ЯЁ][а-яё]+(-[А-ЯЁ][а-яё]+)?"
        title="Введите отчество с большой буквы" placeholder="Иванович" />
    </label>

    <label>
      <span>Введите почту</span>
      <input type="email" name="email" placeholder="example@ya.ru" required />
    </label>
    <label>
      <span>Введите номер телефона:</span>
      <input type="tel" name="phone" pattern="\+\d{8,15}"
        title="Номер должен начинаться с + и содержать от 8 до 15 цифр" placeholder="+74952323232" required />
    </label>
    <button id="submitBtn" class="submit" type="submit">Отправить форму</button>
    <button id="resetBtn" class="reset" type="reset">Очистить форму</button>
  </form>

  <script>
    const submitButton = document.getElementById('submitBtn');
    const resetButton = document.getElementById('resetBtn');
    const form = document.getElementById('domainForm');

    function checkFormValidity() {
      const inputs = form.querySelectorAll('input');
      let isValid = true;
      inputs.forEach(input => {
        if (!input.checkValidity()) {
          isValid = false;
        }
      });
      submitButton.disabled = !isValid;
    }

    function convertToIsoDate(dateStr) {
      const parts = dateStr.split('.');
      if (parts.length !== 3) return null;
      const day = parts[0].padStart(2, '0');
      const month = parts[1].padStart(2, '0');
      const year = parts[2];
      return `${year}-${month}-${day}`;
    }

    async function handleSubmit(event) {
      event.preventDefault();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const formData = new FormData(form);
      const rawDate = formData.get('rentEndDate');
      const isoDate = convertToIsoDate(rawDate);

      if (!isoDate) {
        alert('Неверный формат даты. Используйте ДД.ММ.ГГГГ');
        return;
      }

      const data = {
        DomainName: formData.get('domain'),
        EndRentDate: isoDate,
        User: {
          Surname: formData.get('lastName'),
          Name: formData.get('firstName'),
          MiddleName: formData.get('middleName') || null,
          Email: formData.get('email'),
          Phone: formData.get('phone')
        }
      };

      try {
        const response = await fetch('http://localhost:5070/api/domains/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const responseText = await response.text();

        if (response.ok) {
          try {
            const result = JSON.parse(responseText);
            alert('✅ Успешно отправлено! Ответ: ' + JSON.stringify(result));
          } catch (e) {
            alert(`✅ Успешно (статус ${response.status}), но ответ не JSON:\n${responseText}`);
          }
          form.reset();
          checkFormValidity();
        } else {
          alert(`❌ Ошибка ${response.status}:\n${responseText.substring(0, 500)}`);
        }
      } catch (error) {
        alert('❌ Ошибка соединения: ' + error.message);
      }
    }

    function handleReset() {
      setTimeout(checkFormValidity, 0);
    }

    form.addEventListener('input', checkFormValidity);
    form.addEventListener('submit', handleSubmit);
    form.addEventListener('reset', handleReset);
    document.addEventListener('DOMContentLoaded', checkFormValidity);
  </script>
</body>

</html>
