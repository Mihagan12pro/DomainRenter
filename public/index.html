<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация домена</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <form>
      <!-- раскомментируй, если нужен заголовок в форме -->
      <!-- <h1 class="title">Регистрация домена</h1> -->
      <label>
        <span>Введите доменное имя</span>
        <input
          type="text"
          pattern="[a-zA-Z0-9]+[a-zA-Z0-9.\-]*\.[a-zA-Z]{2,}"
          title=""
          placeholder="site.ru"
          required
        />
      </label>
      <label>
        <span>Введите дату начала регистрации:</span>
        <input
          type="text"
          pattern="(0[1-9]|[12][0-9]|3[01])\.(0[1-9]|1[0-2])\.(19|20)[0-9]{2}"
          title="Введите дату в формате ДД.ММ.ГГГГ"
          placeholder="ДД.ММ.ГГГГ"
          required
        />
      </label>
      <label>
        <span>Введите дату окончания регистрации:</span>
        <input
          type="text"
          pattern="(0[1-9]|[12][0-9]|3[01])\.(0[1-9]|1[0-2])\.(19|20)[0-9]{2}"
          title="Введите дату в формате ДД.ММ.ГГГГ"
          placeholder="ДД.ММ.ГГГГ"
          required
        />
      </label>

      <label>
        <span>Введите ваше имя</span>
        <input
          type="text"
          pattern="[А-ЯЁ][а-яё]+(-[А-ЯЁ][а-яё]+)?"
          title="Введите имя с большой буквы"
          placeholder="Иванов Иван Иванович"
          required
        />
      </label>
      <label>
        <span>Введите почту</span>
        <input type="email" placeholder="example@ya.ru" required />
      </label>
      <label>
        <span>Введите номер телефона:</span>
        <input
          type="tel"
          pattern="\+\d{8,15}"
          title="Номер должен начинаться с + и содержать о 8 до 15 цифр"
          placeholder="+74952323232"
          required
        />
      </label>
      <button id="submitBtn"  class="submit" type="submit">Отправить форму</button>
      <button id="resetBtn"  class="reset" type="reset">Очистить форму</button>
    </form>

</html>
